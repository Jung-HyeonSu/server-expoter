---
# redfish-gather/tasks/account_service_try_one.yml
#
# 복구 후보 1개로 표준 계정 정리를 시도한다. 이미 인증된 후보를 찾았으면 skip
# (loop break 시뮬레이션 — try_one_account.yml 와 같은 패턴).
#
# 입력:
#   _try_recovery      : { username, password, label, role } — recovery vault 의 한 항목
#   _rf_target_account : 표준 계정 (전역 vault 의 role=primary)
#   _rf_account_service_dryrun_effective : 쓰기 여부
#
# 출력:
#   _rf_acct_result         : 모듈 반환값 (인증에 성공한 후보의 것)
#   _rf_acct_auth_ok        : 이 후보가 AccountService 인증에 성공했는가
#   _rf_acct_recovery_label : 성공한 후보의 label (Secret 아님)
#
# **이 파일은 수집을 하지 않는다.** 복구 계정으로 서버 정보를 모으는 경로는 없다.

- when: not (_rf_acct_auth_ok | default(false) | bool)
  block:

    - name: "redfish | account_service | invoke"
      redfish_gather:
        bmc_ip:          "{{ _rf_ip }}"
        username:        "{{ _try_recovery.username | default('') }}"
        password:        "{{ _try_recovery.password | default('') }}"
        timeout:         "{{ _rf_timeout }}"
        verify_ssl:      false
        mode:            "account_provision"
        target_username: "{{ _rf_target_account.username }}"
        target_password: "{{ _rf_target_account.password }}"
        target_role:     "Administrator"
        dryrun:          "{{ _rf_account_service_dryrun_effective | bool }}"
      register: _rf_acct_attempt
      failed_when: false
      no_log: true

    # 모듈이 AccountService GET 에 성공했는가 = 이 복구 자격이 실제로 통했는가.
    # 인증 실패 후보의 결과는 채택하지 않는다 — 다음 후보로 넘어간다.
    - name: "redfish | account_service | evaluate recovery auth"
      ansible.builtin.set_fact:
        _rf_acct_attempt_auth_ok: >-
          {{ ((_rf_acct_attempt.account_service | default({})).auth_ok | default(false)) | bool }}
      no_log: true

    - name: "redfish | account_service | adopt authenticated recovery result"
      when: _rf_acct_attempt_auth_ok | bool
      ansible.builtin.set_fact:
        _rf_acct_result: "{{ _rf_acct_attempt }}"
        _rf_acct_auth_ok: true
        _rf_acct_recovery_label: "{{ _try_recovery.label | default('unlabeled') }}"
      no_log: true

    # 마지막 후보까지 인증이 안 되면 근거가 남아야 한다. 인증 실패 후보의 결과도
    # (채택하지는 않되) 마지막 것을 보관해 errors[].detail 에 실린다.
    - name: "redfish | account_service | keep last unauthenticated result"
      when: not (_rf_acct_attempt_auth_ok | bool)
      ansible.builtin.set_fact:
        _rf_acct_result: "{{ _rf_acct_attempt }}"
      no_log: true

    - name: "redfish | account_service | log recovery attempt"
      ansible.builtin.debug:
        msg: >-
          recovery attempt — label={{ _try_recovery.label | default('unlabeled') }},
          auth_ok={{ _rf_acct_attempt_auth_ok }},
          method={{ (_rf_acct_attempt.account_service | default({})).method | default('?') }},
          verification={{ (_rf_acct_attempt.account_service | default({})).verification | default('?') }}

    # BMC lockout 회피 — 인증 실패 후보 뒤에는 간격을 둔다 (try_one_account.yml 와 동일 근거:
    # Dell 5회/5분, HPE 3회, Lenovo 5회). site.yml strategy: free 호환 위해 pause 대신 sleep.
    - name: "redfish | account_service | backoff on recovery auth failure"
      when: not (_rf_acct_attempt_auth_ok | bool)
      ansible.builtin.command: sleep 5
      delegate_to: localhost
      changed_when: false
