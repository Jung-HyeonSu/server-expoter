---
# ==============================================================================
# common/tasks/credential/resolve_and_load.yml — Credential scope 결정 + Vault 로딩
# ==============================================================================
# 3채널(OS / ESXi / Redfish) 공통. Credential 선택의 유일한 진입점이다.
#
# 선택 Contract:
#     OS      = location + os_type   → vault/<loc>/os/<os_type>.yml
#     ESXi    = location             → vault/<loc>/esxi.yml
#     Redfish = location + vendor    → vault/<loc>/redfish/<vendor>.yml
#
# 입력 (호출 측이 vars 로 넘긴다):
#   _cred_target_type : 'os' | 'esxi' | 'redfish'   (필수)
#   _cred_os_type     : 'linux' | 'windows'          (target_type=os 일 때)
#   _cred_vendor      : canonical vendor             (target_type=redfish 일 때)
#   se_location       : extra-var (-e se_location=<id>) — Jenkins 가 전달
#
# 출력:
#   _cred_scope         : "ich/redfish/dell" — 사람이 읽는 범위 식별자 (Secret 아님)
#   _cred_reason        : resolved | unknown_location | unknown_target_type
#                         | unknown_os_type | vendor_unresolved
#   _cred_load_outcome  : loaded | credential_set_missing | credential_set_undecryptable
#                         | empty_accounts | not_resolved
#   _cred_accounts      : list[{username, password, label, role}] — **vault 순서 그대로**
#   _cred_become_password : Linux sudo 용 (vault 에 있을 때만)
#
# 원칙:
#   - 다른 Location / Vendor 의 vault 로 넘어가는 분기가 **없다.** hard cut.
#   - 기존 flat vault(vault/linux.yml 등)로의 runtime fallback 이 **없다.**
#     경로가 하나뿐이라 "조용히 옛 파일을 열어 성공한 것처럼 보이는" 상태가 불가능하다.
#   - Secret 을 다루는 태스크는 전부 `no_log: true`.
#   - `cacheable` 을 쓰지 않는다 (rule 27 R6 — vault 변경 자동 반영 보장).
#   - 여기서 실패해도 fail 하지 않는다. 호출 측 block/rescue 가 정상 failed envelope 을
#     만들도록 판정 결과만 넘긴다 (rule 11 — envelope 이 사라지면 안 된다).
# ==============================================================================

- name: "credential | resolve scope"
  ansible.builtin.set_fact:
    _cred_resolved: >-
      {{ lookup('credential_resolver',
                location=se_location | default(''),
                target_type=_cred_target_type,
                os_type=_cred_os_type | default(''),
                vendor=_cred_vendor | default(''),
                repo_root=lookup('env','REPO_ROOT')) }}

- name: "credential | expose scope"
  ansible.builtin.set_fact:
    _cred_scope: "{{ _cred_resolved.credential_scope | default('') }}"
    _cred_reason: "{{ _cred_resolved.reason | default('unknown_location') }}"
    _cred_vault_relpath: "{{ _cred_resolved.vault_relpath | default('') }}"

# ── scope 를 못 정했으면 여기서 끝. 경로를 추측해서 열지 않는다. ─────────────
- name: "credential | not resolved"
  ansible.builtin.set_fact:
    _cred_accounts: []
    _cred_become_password: ""
    _cred_load_outcome: "not_resolved"
  when: _cred_reason != 'resolved'

- name: "credential | resolved"
  when: _cred_reason == 'resolved'
  block:
    # 파일 부재와 복호화 실패를 구분하기 위해 include_vars 앞에 둔다.
    # delegate_to: localhost — 이 시점에는 대상 인증이 아직 안 됐고 vault 는
    # controller 파일이다 (os-gather PLAY2/3 는 ansible_connection=ssh/winrm).
    - name: "credential | stat vault file"
      ansible.builtin.stat:
        path: "{{ lookup('env','REPO_ROOT') }}/{{ _cred_vault_relpath }}"
      delegate_to: localhost
      become: false
      register: _cred_vault_stat

    - name: "credential | include vault"
      ansible.builtin.include_vars:
        file: "{{ lookup('env','REPO_ROOT') }}/{{ _cred_vault_relpath }}"
        name: _cred_vault_data
      no_log: true
      failed_when: false
      register: _cred_vault_load
      when: _cred_vault_stat.stat.exists | default(false)

    # 순서 보존 정규화 — filter_plugins/credential_accounts.py (구현 정본은
    # module_utils/credential_common.normalize_accounts 하나뿐이다).
    - name: "credential | normalize accounts"
      ansible.builtin.set_fact:
        _cred_accounts: "{{ _cred_vault_data | default({}) | credential_accounts }}"
        _cred_become_password: >-
          {{ (_cred_vault_data | default({})).ansible_become_password | default('') }}
      no_log: true

    - name: "credential | classify load outcome"
      ansible.builtin.set_fact:
        _cred_load_outcome: >-
          {{ 'credential_set_missing'
             if not (_cred_vault_stat.stat.exists | default(false))
             else ('credential_set_undecryptable'
                   if (_cred_vault_load is defined and _cred_vault_load is failed)
                   else ('empty_accounts'
                         if (_cred_accounts | length) == 0
                         else 'loaded')) }}

# ── 요약 (Secret 없음 — 개수와 label 만) ────────────────────────────────────
- name: "credential | summary"
  ansible.builtin.debug:
    msg: >-
      credential_scope={{ _cred_scope | default('') | ternary(_cred_scope, '(unresolved: ' ~ _cred_reason ~ ')') }},
      outcome={{ _cred_load_outcome | default('not_resolved') }},
      accounts={{ _cred_accounts | default([]) | length }},
      labels={{ _cred_accounts | default([]) | map(attribute='label') | list }}
