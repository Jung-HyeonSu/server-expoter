[linux_targets]
ubuntu-r760-6-baremetal ansible_host=10.100.64.96
rhel-810-raw-fallback   ansible_host=10.100.64.161 ansible_python_interpreter=/usr/libexec/platform-python
rhel-92                 ansible_host=10.100.64.163
rhel-96                 ansible_host=10.100.64.165
rocky-96                ansible_host=10.100.64.169
